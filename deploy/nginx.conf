# Install only before Certbot adds HTTPS. Do not overwrite the live TLS config.
server {
    listen 80;
    listen [::]:80;
    server_name mindvortex.pro www.mindvortex.pro;
    client_max_body_size 16k;
    access_log /var/log/nginx/mindvortex.access.log;
    error_log /var/log/nginx/mindvortex.error.log;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This host is the internet-facing proxy: overwrite untrusted client headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
