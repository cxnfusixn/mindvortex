# Optional isolated preview origin. Install separately, then provision HTTPS with
# Certbot before setting NEXT_PUBLIC_PREVIEW_ORIGIN=https://previews.mindvortex.pro.
server {
    listen 80;
    listen [::]:80;
    server_name previews.mindvortex.pro;
    root /var/www/mindvortex-previews;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "frame-ancestors https://mindvortex.pro; object-src 'none'; base-uri 'self'; form-action 'none'" always;
    location /previews/ {
        try_files $uri $uri/ $uri/index.html =404;
    }
    location / { return 404; }
}
